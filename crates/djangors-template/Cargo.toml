[package]
name = "djangors-template"
description = "Template engine integration for Djangors"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
minijinja = { version = "2.21.0", features = ["loader"] }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
djangors-core = { path = "../djangors-core", version = "0.2.2" }
djangors-i18n = { path = "../djangors-i18n", version = "0.2.2" }
chrono = { version = "0.4", features = ["std", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
