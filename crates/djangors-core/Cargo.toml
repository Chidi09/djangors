[package]
name = "djangors-core"
description = "HTTP kernel for the Djangors web framework (placeholder release)"
repository = "https://github.com/djangors/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hyper = { version = "1.10.1", features = ["http1"] }
http-body-util = "0.1.4"
bytes = "1.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
percent-encoding = "2.3.2"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = [
    "trace",
    "compression-gzip",
    "compression-br",
    "set-header",
    "normalize-path",
    "request-id",
    "util",
] }
tracing = "0.1.44"
toml = "0.8.20"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["full"] }
