[package]
name = "djangors-core"
description = "HTTP kernel for the Djangors web framework"
repository = "https://github.com/djangors/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio", "service"] }
http-body-util = "0.1.4"
bytes = "1.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
percent-encoding = "2.3.2"
tokio = { version = "1.53.0", features = [
    "net",
    "rt-multi-thread",
    "macros",
    "io-util",
    "signal",
    "time",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = [
    "trace",
    "compression-gzip",
    "compression-br",
    "set-header",
    "normalize-path",
    "request-id",
    "util",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
toml = "0.8.20"
async-trait = "0.1.86"
serde_urlencoded = "0.7.1"
rand = "0.8.7"

[dev-dependencies]
djangors-db = { path = "../djangors-db" }
djangors-orm = { path = "../djangors-orm" }
djangors-macros = { path = "../djangors-macros" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
