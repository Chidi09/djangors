[package]
name = "djangors-auth"
description = "Authentication, users, and permissions for Djangors"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-orm = { path = "../djangors-orm" }
djangors-macros = { path = "../djangors-macros" }
djangors-core = { path = "../djangors-core" }
djangors-db = { path = "../djangors-db" }
djangors-sessions = { path = "../djangors-sessions" }
djangors-mail = { path = "../djangors-mail" }
async-trait = "0.1.86"
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
chrono = { version = "0.4.45", features = ["std", "serde"] }
thiserror = "2.0.18"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
hyper = { version = "1.10.1", features = ["http1", "server"] }
bytes = "1.12.1"
