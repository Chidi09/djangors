[package]
name = "djangors-auth"
description = "Authentication, users, and permissions for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "auth", "permissions", "users"]
categories = ["authentication"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-orm = { path = "../djangors-orm", version = "0.6.2" }
djangors-macros = { path = "../djangors-macros", version = "0.6.2" }
djangors-core = { path = "../djangors-core", version = "0.6.2" }
djangors-db = { path = "../djangors-db", version = "0.6.2" }
djangors-sessions = { path = "../djangors-sessions", version = "0.6.2" }
djangors-mail = { path = "../djangors-mail", version = "0.6.2" }
async-trait = "0.1.86"
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
chrono = { version = "0.4.45", features = ["std", "serde"] }
thiserror = "2.0.18"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
hyper = { version = "1.10.1", features = ["http1", "server"] }
bytes = "1.12.1"
