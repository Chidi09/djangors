[package]
name = "djangors-contrib-redirects"
description = "Admin-editable database redirects for Djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-admin = { path = "../djangors-admin", version = "0.2.0" }
djangors-core = { path = "../djangors-core", version = "0.2.0" }
djangors-macros = { path = "../djangors-macros", version = "0.2.0" }
djangors-orm = { path = "../djangors-orm", version = "0.2.0" }

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
bytes = "1.12.1"
hyper = { version = "1.10.1", features = ["http1"] }
