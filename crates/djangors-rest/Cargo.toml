[package]
name = "djangors-rest"
description = "REST framework with serializers and ViewSets for Djangors"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
jwt = ["dep:jsonwebtoken"]

[dependencies]
djangors-orm = { path = "../djangors-orm", version = "0.2.2" }
djangors-core = { path = "../djangors-core", version = "0.2.2" }
djangors-db = { path = "../djangors-db", version = "0.2.2" }
djangors-macros = { path = "../djangors-macros", version = "0.2.2" }
djangors-auth = { path = "../djangors-auth", version = "0.2.2" }
djangors-sessions = { path = "../djangors-sessions", version = "0.2.2" }
async-trait = "0.1.86"
rand = "0.8.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.45", features = ["std", "serde"] }
hyper = { version = "1.10.1", features = ["http1"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"], optional = true }
base64 = "0.22.1"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
bytes = "1.12.1"
