[package]
name = "djangors-rest"
description = "REST framework with serializers and ViewSets for Djangors"
repository = "https://github.com/djangors/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-orm = { path = "../djangors-orm" }
djangors-core = { path = "../djangors-core" }
djangors-db = { path = "../djangors-db" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.45", features = ["std", "serde"] }
hyper = { version = "1.10.1", features = ["http1"] }

[dev-dependencies]
djangors-macros = { path = "../djangors-macros" }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
bytes = "1.12.1"
