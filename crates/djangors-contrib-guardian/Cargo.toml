[package]
name = "djangors-contrib-guardian"
description = "Object-level permissions for Djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-auth = { path = "../djangors-auth", version = "0.5.0" }
djangors-db = { path = "../djangors-db", version = "0.5.0" }
djangors-macros = { path = "../djangors-macros", version = "0.5.0" }
djangors-orm = { path = "../djangors-orm", version = "0.5.0" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
djangors-core = { path = "../djangors-core" }
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
chrono = "0.4"
