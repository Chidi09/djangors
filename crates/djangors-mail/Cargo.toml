[package]
name = "djangors-mail"
description = "Minimal mail library for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "email", "mail", "smtp"]
categories = ["email"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.86"
thiserror = "2.0.18"
tracing = "0.1.44"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"] }
tokio = { version = "1.53.0", features = ["fs", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
