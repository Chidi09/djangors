[package]
name = "djangors-test"
description = "Testing utilities for the Djangors web framework"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "testing", "helpers", "test"]
categories = ["development-tools::testing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-core = { path = "../djangors-core", version = "0.6.0" }
djangors-db = { path = "../djangors-db", version = "0.6.0" }
djangors-orm = { path = "../djangors-orm", version = "0.6.0" }
djangors-sessions = { path = "../djangors-sessions", version = "0.6.0" }
bytes = "1.12.1"
hyper = "1.10.1"
serde_urlencoded = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
