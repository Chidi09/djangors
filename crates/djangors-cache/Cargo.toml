[package]
name = "djangors-cache"
description = "Cache backends and middleware for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "cache", "redis", "moka"]
categories = ["caching"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
redis = ["dep:redis"]

[dependencies]
async-trait = "0.1.86"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
djangors-db = { path = "../djangors-db", version = "0.6.2" }
http-body-util = "0.1.4"
moka = { version = "0.12.15", features = ["future"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["time", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
hyper = { version = "1.10.1", features = ["http1"] }
redis = { version = "1.4.1", features = ["tokio-comp"], optional = true }

[dev-dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "time"] }
