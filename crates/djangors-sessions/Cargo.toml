[package]
name = "djangors-sessions"
description = "Session engines for the Djangors web framework"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-core = { path = "../djangors-core", version = "0.6.0" }
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rand = "0.8.7"
tower = { version = "0.5.3", features = ["util"] }
hyper = "1.10.1"
http-body-util = "0.1.4"
bytes = "1.12.1"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
