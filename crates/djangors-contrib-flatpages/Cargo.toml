[package]
name = "djangors-contrib-flatpages"
description = "Admin-editable exact-path flatpages for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "flatpages", "cms", "static-pages"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-admin = { path = "../djangors-admin", version = "0.6.2" }
djangors-core = { path = "../djangors-core", version = "0.6.2" }
djangors-macros = { path = "../djangors-macros", version = "0.6.2" }
djangors-orm = { path = "../djangors-orm", version = "0.6.2" }

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
bytes = "1.12.1"
hyper = { version = "1.10.1", features = ["http1"] }
