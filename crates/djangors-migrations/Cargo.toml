[package]
name = "djangors-migrations"
description = "Migration engine with autodetection for Djangors"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-orm = { path = "../djangors-orm" }
djangors-db = { path = "../djangors-db" }
thiserror = "2.0.18"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1.53.0", features = ["rt", "macros"] }

[dev-dependencies]
djangors-macros = { path = "../djangors-macros" }
