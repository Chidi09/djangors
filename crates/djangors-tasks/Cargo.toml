[package]
name = "djangors-tasks"
description = "Background task queue, #[task] macro, and worker for Djangors"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-db = { path = "../djangors-db" }
djangors-orm = { path = "../djangors-orm" }
djangors-macros = { path = "../djangors-macros" }
djangors-admin = { path = "../djangors-admin" }
inventory = "0.3.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["std", "serde"] }
cron = "0.17.0"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt", "time", "sync", "macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["full", "rt-multi-thread"] }
