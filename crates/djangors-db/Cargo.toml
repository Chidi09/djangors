[package]
name = "djangors-db"
description = "Database backends for the Djangors web framework"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "chrono", "uuid", "rust_decimal", "json"] }
tokio = { version = "1.53.0", features = ["rt", "macros"] }
chrono = { version = "0.4", features = ["std"] }
thiserror = "2.0.18"

