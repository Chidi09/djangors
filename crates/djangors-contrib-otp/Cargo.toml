[package]
name = "djangors-contrib-otp"
description = "TOTP enrollment and verification for Djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-auth = { path = "../djangors-auth", version = "0.1.0" }
djangors-macros = { path = "../djangors-macros", version = "0.1.0" }
djangors-orm = { path = "../djangors-orm", version = "0.1.0" }
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth"] }

[dev-dependencies]
djangors-test = { path = "../djangors-test", version = "0.1.0" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
