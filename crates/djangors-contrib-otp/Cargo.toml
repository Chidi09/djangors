[package]
name = "djangors-contrib-otp"
description = "TOTP enrollment and verification for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "totp", "2fa", "otp"]
categories = ["authentication"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-auth = { path = "../djangors-auth", version = "0.6.2" }
djangors-macros = { path = "../djangors-macros", version = "0.6.2" }
djangors-orm = { path = "../djangors-orm", version = "0.6.2" }
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth"] }

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
