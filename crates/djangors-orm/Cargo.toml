[package]
name = "djangors-orm"
description = "Django-style ORM with querysets and model metadata for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "orm", "sql", "queryset"]
categories = ["database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-forms = { path = "../djangors-forms", version = "0.6.2" }
serde = { version = "1.0.228", features = ["derive"] }
inventory = "0.3.24"
thiserror = "2.0.18"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "sqlite", "chrono"] }
chrono = { version = "0.4", features = ["std"] }
djangors-db = { path = "../djangors-db", version = "0.6.2" }
tokio = { version = "1.53.0", features = ["rt"] }

[dev-dependencies]
djangors-macros = { path = "../djangors-macros" }
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["rt", "macros"] }
