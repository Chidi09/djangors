[package]
name = "djangors-cli"
description = "The dj command-line tool for the Djangors web framework (placeholder release)"
repository = "https://github.com/djangors/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "dj"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
djangors-db = { path = "../djangors-db" }
djangors-migrations = { path = "../djangors-migrations" }
djangors-staticfiles = { path = "../djangors-staticfiles" }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
