[package]
name = "djangors-cli"
description = "The dj command-line tool for the Djangors web framework (placeholder release)"
repository = "https://github.com/djangors/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "dj"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
djangors-db = { path = "../djangors-db" }
djangors-migrations = { path = "../djangors-migrations" }
djangors-staticfiles = { path = "../djangors-staticfiles" }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
djangors-auth = { path = "../djangors-auth" }
djangors-orm = { path = "../djangors-orm" }
djangors-core = { path = "../djangors-core" }
chrono = { version = "0.4.45", features = ["std", "serde"] }
toml = "0.8.20"

[dev-dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
