[package]
name = "djangors-cli"
description = "The dj command-line tool for the Djangors web framework"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "dj"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
djangors-db = { path = "../djangors-db", version = "0.4.0" }
djangors-migrations = { path = "../djangors-migrations", version = "0.4.0" }
djangors-staticfiles = { path = "../djangors-staticfiles", version = "0.4.0" }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
djangors-auth = { path = "../djangors-auth", version = "0.4.0" }
djangors-contrib-contenttypes = { path = "../djangors-contrib-contenttypes", version = "0.4.0" }
djangors-orm = { path = "../djangors-orm", version = "0.4.0" }
djangors-core = { path = "../djangors-core", version = "0.4.0" }
djangors-tasks = { path = "../djangors-tasks", version = "0.4.0" }
chrono = { version = "0.4.45", features = ["std", "serde"] }
toml = "0.8.20"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }

[dev-dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
