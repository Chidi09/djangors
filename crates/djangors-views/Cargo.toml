[package]
name = "djangors-views"
description = "Server-rendered generic class-based views for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "views", "cbv", "rendering"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-core = { path = "../djangors-core", version = "0.6.0" }
djangors-orm = { path = "../djangors-orm", version = "0.6.0" }
djangors-template = { path = "../djangors-template", version = "0.6.0" }
hyper = { version = "1.10.1", features = ["http1"] }
serde_json = "1.0"

[dev-dependencies]
djangors-macros = { path = "../djangors-macros" }
djangors-db = { path = "../djangors-db" }
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tempfile = "3.27.0"
bytes = "1.12.1"

