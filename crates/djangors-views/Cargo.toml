[package]
name = "djangors-views"
description = "Server-rendered generic class-based views for Djangors"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-core = { path = "../djangors-core", version = "0.2.0" }
djangors-orm = { path = "../djangors-orm", version = "0.2.0" }
djangors-template = { path = "../djangors-template", version = "0.2.0" }
hyper = { version = "1.10.1", features = ["http1"] }
serde_json = "1.0"

[dev-dependencies]
djangors-macros = { path = "../djangors-macros", version = "0.2.0" }
djangors-db = { path = "../djangors-db", version = "0.2.0" }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tempfile = "3.27.0"
bytes = "1.12.1"

