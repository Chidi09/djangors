[package]
name = "djangors-contrib-payments"
description = "Payment provider integration (Paystack) for Djangors, with idempotent transaction recording"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-macros = { path = "../djangors-macros", version = "0.2.0" }
djangors-orm = { path = "../djangors-orm", version = "0.2.0" }
async-trait = "0.1.86"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["std"] }

[dev-dependencies]
djangors-test = { path = "../djangors-test", version = "0.2.0" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
wiremock = "0.6"
