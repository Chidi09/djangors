<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<style>
:root {
  --bg: #ffffff;
  --fg: #111827;
  --muted: #6b7280;
  --accent: #2563eb;
  --border: #d1d5db;
  --input-bg: #ffffff;
  --row-alt: #f9fafb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115;
    --fg: #e5e7eb;
    --muted: #9ca3af;
    --accent: #60a5fa;
    --border: #374151;
    --input-bg: #1a1d23;
    --row-alt: #16181d;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0;
  padding: 2rem;
  line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
th { background: var(--row-alt); }
tbody tr:nth-child(even) { background: var(--row-alt); }
input, button, select { font: inherit; color: inherit; }
input[type="text"], input[type="number"] {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.35rem 0.5rem;
  color: var(--fg);
}
button, input[type="submit"] {
  background: var(--accent);
  color: #ffffff;
  border: none;
  border-radius: 4px;
  padding: 0.4rem 0.9rem;
  cursor: pointer;
}
button:hover, input[type="submit"]:hover { opacity: 0.9; }
.date-hierarchy { margin: 0.5rem 0; color: var(--muted); }
h1 { font-size: 1.25rem; margin: 0 0 1rem; }
.site-logo { height: 1.5em; vertical-align: middle; margin-right: 0.5rem; }
</style>
{% if accent_color %}<style>:root { --accent: {{ accent_color }}; }</style>{% endif %}
</head>
<body>
<h1>{% if logo_url %}<img src="{{ logo_url|safe }}" alt="" class="site-logo">{% endif %}{{ site_header }}</h1>
{% block content %}{% endblock %}
</body>
</html>
