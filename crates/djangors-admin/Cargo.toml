[package]
name = "djangors-admin"
description = "Auto-generated admin interface for Djangors"
repository = "https://github.com/Chidi09/djangors"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
djangors-orm = { path = "../djangors-orm", version = "0.1.0" }
djangors-core = { path = "../djangors-core", version = "0.1.0" }
djangors-auth = { path = "../djangors-auth", version = "0.1.0" }
djangors-db = { path = "../djangors-db", version = "0.1.0" }
djangors-template = { path = "../djangors-template", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
minijinja = { version = "2.21.0" }
async-trait = "0.1.86"
chrono = { version = "0.4.45", features = ["std", "serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
djangors-macros = { path = "../djangors-macros", version = "0.1.0" }
percent-encoding = "2.3.2"

[dev-dependencies]
djangors-sessions = { path = "../djangors-sessions", version = "0.1.0" }
djangors-macros = { path = "../djangors-macros", version = "0.1.0" }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
chrono = { version = "0.4.45", features = ["std", "serde"] }
hyper = { version = "1.10.1", features = ["http1", "server"] }
bytes = "1.12.1"
