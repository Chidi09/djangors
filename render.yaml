databases:
  - name: djangors-polls-db
    databaseName: djangors_polls
    plan: free
  - name: djangors-school-db
    databaseName: djangors_school
    plan: free

services:
  - type: web
    name: djangors-polls
    runtime: docker
    dockerContext: .
    dockerfilePath: ./examples/polls/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: djangors-polls-db
          property: connectionString
      - key: DJANGORS_SECRET_KEY
        generateValue: true
      - key: DJANGORS_DEBUG
        value: "false"
      # ALLOWED_HOSTS defaults to 127.0.0.1/localhost only (secure by default,
      # mirroring Django) - without this, Render's real public hostname would be
      # rejected on every request.
      - key: DJANGORS_ALLOWED_HOSTS
        value: "djangors-polls.onrender.com"
      # HOST defaults to 127.0.0.1 for safe local dev (mirroring Django's own
      # runserver default) - inside a container, Render's port scanner checks
      # 0.0.0.0, so without this the deploy times out waiting for a port that's
      # only listening on loopback.
      - key: DJANGORS_HOST
        value: "0.0.0.0"

  - type: web
    name: djangors-school
    runtime: docker
    dockerContext: .
    dockerfilePath: ./examples/school/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: djangors-school-db
          property: connectionString
      - key: DJANGORS_SECRET_KEY
        generateValue: true
      - key: DJANGORS_DEBUG
        value: "false"
      - key: DJANGORS_ALLOWED_HOSTS
        value: "djangors-school.onrender.com"
      - key: DJANGORS_HOST
        value: "0.0.0.0"
